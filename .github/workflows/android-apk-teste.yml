name: UltraTel Android - APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar atualização para usuários do UltraTel'
        type: boolean
        required: true
        default: false
      release_notes:
        description: 'Novidades da atualização'
        type: string
        required: false
        default: 'Melhorias e correções do UltraTel'

permissions:
  contents: write

concurrency:
  group: telegram-apk-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK UltraTel
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Liberar espaço do runner
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc
          df -h

      - name: Baixar código e submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar credenciais Telegram e assinatura própria
        env:
          ULTRATEL_API_ID: ${{ secrets.ULTRATEL_API_ID }}
          ULTRATEL_API_HASH: ${{ secrets.ULTRATEL_API_HASH }}
          ULTRATEL_KEYSTORE_B64: ${{ secrets.ULTRATEL_KEYSTORE_B64 }}
          ULTRATEL_KEYSTORE_PASSWORD: ${{ secrets.ULTRATEL_KEYSTORE_PASSWORD }}
        run: python3 scripts/prepare_ultratel_build.py

      - name: Localizar Android SDK pré-instalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/cmdline-tools"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Instalar SDK 36, Build Tools, NDK e CMake
        run: |
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Instalar dependências nativas
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson nasm gperf pkg-config unzip python3-pil

      - name: Preparar icone do UltraTel
        run: python3 scripts/install_ultratel_icon.py

      - name: Configurar Rust para Android
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add --toolchain 1.96.1 \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android
          echo "RUSTUP_TOOLCHAIN=1.96.1" >> "$GITHUB_ENV"

      - name: Compilar APK UltraTel (afatRelease)
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ultratel-android-release
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          if-no-files-found: error
          retention-days: 7

      - name: Preparar release e manifesto SHA-256
        if: ${{ inputs.publish_release == true }}
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          props = pathlib.Path('gradle.properties').read_text()
          def get(key):
              m = re.search(r'^' + re.escape(key) + r'=(.*)$', props, re.M)
              if not m: raise ValueError('Missing ' + key)
              return m.group(1).strip()
          code = int(get('APP_VERSION_CODE')) * 10 + 9
          version = get('APP_VERSION_NAME')
          tag = 'ultratel-v' + str(code)
          apk = pathlib.Path('TMessagesProj_App/build/outputs/apk/afat/release/app.apk')
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          manifest = {
              'version_code': code,
              'version': version,
              'notes': os.environ.get('RELEASE_NOTES') or 'Melhorias e correções',
              'sha256': sha,
              'apk_url': f'https://github.com/elenilda10/Telegram/releases/download/{tag}/ultratel.apk',
          }
          pathlib.Path('ultratel-update.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2))
          pathlib.Path('ultratel.apk').write_bytes(apk.read_bytes())
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('ULTRATEL_RELEASE_TAG=' + tag + '\n')
          print('Release:', tag, 'SHA-256:', sha)
          PY

      - name: Publicar GitHub Release
        if: ${{ inputs.publish_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if gh release view "$ULTRATEL_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Esta versão já foi publicada; aumente APP_VERSION_CODE antes de lançar outra atualização."
            exit 1
          fi
          gh release create "$ULTRATEL_RELEASE_TAG" ultratel.apk ultratel-update.json \
            --title "UltraTel $ULTRATEL_RELEASE_TAG" \\
            --notes "$RELEASE_NOTES" \
            --latest
