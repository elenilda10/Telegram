name: Android APK - teste

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-apk-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK de teste
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Liberar espaço do runner
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc
          df -h

      - name: Baixar código e submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 36, Build Tools, NDK e CMake
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Instalar dependências nativas
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson nasm gperf pkg-config unzip

      - name: Configurar Rust para Android
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add --toolchain 1.96.1 \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android
          echo "RUSTUP_TOOLCHAIN=1.96.1" >> "$GITHUB_ENV"

      - name: Compilar APK de teste (afatDebug)
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-android-apk-teste
          path: TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          if-no-files-found: error
          retention-days: 7
